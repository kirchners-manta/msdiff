# Continuous integration: lint (pre-commit) and tests (pytest + coverage, uploaded to Codecov).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual trigger from the Actions tab

# cancel a running workflow when a newer commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # oldest supported version, matches mypy's python_version
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC upload to Codecov, no CODECOV_TOKEN secret needed
    strategy:
      fail-fast: false # report all versions, not just the first failure
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.cfg
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest coverage covdefaults
      - name: Run tests with coverage
        # fails below fail_under in pyproject.toml
        run: |
          coverage run -m pytest
          coverage report -m
          coverage xml -o coverage.xml
      - name: Upload coverage to Codecov
        # one upload is enough: the code paths do not depend on the Python version
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          # a Codecov outage must not block merges (the test jobs are required checks)
          fail_ci_if_error: false
