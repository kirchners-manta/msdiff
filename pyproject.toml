[build-system]
  requires = ["setuptools"]
  build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
  testpaths = ["test"]
  pythonpath = ["src"]


[tool.isort]
  profile = "black"
  # fixed first-party package: detection otherwise depends on the checkout/environment
  known_first_party = ["msdiff"]


[tool.mypy]
  # check against the oldest supported version (setup.cfg: python_requires)
  python_version = "3.12"
  check_untyped_defs = true
  disallow_any_generics = true
  disallow_incomplete_defs = true
  disallow_untyped_defs = true
  warn_redundant_casts = true
  warn_unreachable = true
  warn_unused_ignores = true


[tool.coverage.run]
  plugins = ["covdefaults"]
  source = ["./src"]

[tool.coverage.report]
  fail_under = 90


[[tool.mypy.overrides]]
  # lmfit ships neither stubs nor a py.typed marker
  module = ["lmfit", "lmfit.*"]
  ignore_missing_imports = true
